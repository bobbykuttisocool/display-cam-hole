name: Build GREATNESS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack GREATNESS v12 ZIP
        run: |
          ZIP_FILE=$(ls GREATNESS-v12*.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unpacking $ZIP_FILE..."
            rm -rf app build.gradle.kts settings.gradle.kts gradle.properties
            unzip -o "$ZIP_FILE" -x ".github/*"
          else
            echo "ERROR: GREATNESS-v12.zip not found in repo root!"
            ls -la
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Universal Debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: GREATNESS-v12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
